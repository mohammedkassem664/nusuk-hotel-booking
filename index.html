function starsHTML(stars){

    if(!stars){
        return "⭐ التصنيف غير محدد";
    }

    return "⭐".repeat(stars);
}


function showHotels(){

    document.getElementById("homePage").style.display="none";
    document.getElementById("detailPage").style.display="none";
    document.getElementById("hotelsPage").style.display="block";

    renderHotels(hotels);

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}


function goHome(){

    document.getElementById("hotelsPage").style.display="none";
    document.getElementById("detailPage").style.display="none";
    document.getElementById("homePage").style.display="block";

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}


function renderHotels(list){

    const grid=document.getElementById("hotelsGrid");

    grid.innerHTML="";

    if(list.length===0){

        grid.innerHTML=`
            <div style="grid-column:1/-1;text-align:center;padding:30px">
                لا يوجد فندق بهذا الاسم 🔎
            </div>
        `;

        return;
    }


    list.forEach(hotel=>{

        const card=document.createElement("div");

        card.className="hotel-card";

        card.onclick=()=>showHotel(hotel.id);

        card.innerHTML=`

            <div class="hotel-image">
                صورة الفندق<br>
                نضيفها لاحقًا 📸
            </div>

            <div class="hotel-info">

                <h3>${hotel.name}</h3>

                <div class="stars">
                    ${starsHTML(hotel.stars)}
                </div>

                <p>📍 ${hotel.location}</p>

                ${
                    hotel.distance
                    ? `<p>🕋 ${hotel.distance}</p>`
                    : ""
                }

            </div>
        `;

        grid.appendChild(card);

    });

}


function searchHotels(){

    const value=
        document.getElementById("search")
        .value
        .trim()
        .toLowerCase();

    const filtered=
        hotels.filter(hotel=>
            hotel.name.toLowerCase().includes(value)
        );

    renderHotels(filtered);
}


function showHotel(id){

    const hotel=
        hotels.find(h=>h.id===id);

    if(!hotel) return;

    document.getElementById("homePage").style.display="none";
    document.getElementById("hotelsPage").style.display="none";
    document.getElementById("detailPage").style.display="block";


    const stars=
        hotel.stars
        ? starsHTML(hotel.stars)
        : "⭐ التصنيف غير محدد";


    const whatsappMessage=
        encodeURIComponent(
            `السلام عليكم، أريد الاستفسار عن حجز ${hotel.name}`
        );


    let detailsHTML="";

        detailsHTML+=`
            <li>🕋 <strong>المسافة عن الحرم:</strong>
            ${hotel.distance}</li>
        `;
    }


    if(hotel.walk){

        detailsHTML+=`
            <li>🚶 <strong>المشي للحرم:</strong>
            ${hotel.walk}</li>
        `;
    }


    if(hotel.rooms){

        detailsHTML+=`
            <li>🛏️ <strong>الغرف:</strong>
            ${hotel.rooms}</li>
        `;
    }


    if(hotel.transport){

        detailsHTML+=`
            <li>🚌 <strong>المواصلات:</strong>
            ${hotel.transport}</li>
        `;
    }


    hotel.features.forEach(feature=>{

        detailsHTML+=`
            <li>✓ ${feature}</li>
        `;

    });


    document.getElementById("hotelDetails").innerHTML=`

        <div class="detail-card">

            <div class="detail-location">
